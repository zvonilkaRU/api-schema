name: Release — Permanent Tag

# On push to main: run codegen, commit generated code, bump version, create permanent tag.
# Skips commits from the bot itself to avoid infinite loops.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Codegen + Release
    runs-on: ubuntu-latest
    # ci#30: включён обратно. Тег режется при расхождении generated/ в HEAD
    # с последним тегом: docs-only и CI-only пушы не тегируются, а контракты
    # (мерджи PR со спеками) — тегируются всегда (раньше версия поднималась
    # на каждый push в main, даже docs-only — вероятно, поэтому воркфлоу
    # и ставили на паузу).
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run codegen
        env:
          GOPRIVATE: github.com/zvonilkaRU,github.com/ilovepitsa
        run: |
          go run github.com/ilovepitsa/oapicodegen/cmd/oapigen@v1.3.6 \
            -input ./zvonilkaRU \
            -output ./generated \
            -import-prefix github.com/zvonilkaRU/api-schema/generated \
            -generation-flags-config-path ./generation_flags.yaml

      - name: Commit regenerated code
        id: codegen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --staged --quiet; then
            echo "No codegen changes — skipping commit."
          else
            git commit -m "chore: regenerate code [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Тег не привязан к факту codegen-коммита выше: ci.yml на PR требует,
      # чтобы регенерация была уже закоммичена в ветку («Check diff» валит
      # рассинхрон), поэтому после мержа codegen даёт нулевой diff и
      # условие changed == 'true' не срабатывало никогда. Режем тег, когда
      # generated/ в HEAD отличается от generated/ в последнем теге;
      # автокоммит выше остаётся как ремонт дрейфа при прямых пушах в main.
      - name: Bump version and tag
        run: |
          # Последний стабильный тег (пререлизные -pr.* отсеиваем)
          LATEST=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v '\-pr\.' | head -1 || true)

          # Нет тегов — сравниваем с пустым деревом (тег, если generated/ непуст)
          NEED_TAG=false
          if [ -n "${LATEST}" ]; then
            git diff --quiet "${LATEST}" HEAD -- generated/ || NEED_TAG=true
          else
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            git diff --quiet "${EMPTY_TREE}" HEAD -- generated/ || NEED_TAG=true
          fi
          if [ "${NEED_TAG}" = "false" ]; then
            echo "generated/ не отличается от ${LATEST:-<тегов нет>} — тег не режем."
            exit 0
          fi

          if [ -z "${LATEST}" ]; then
            NEW="v0.0.1"
          else
            BASE="${LATEST#v}"
            MAJOR="${BASE%%.*}"
            REST="${BASE#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            PATCH="${PATCH%%-*}"
            NEW="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "Latest: ${LATEST:-none} → New: ${NEW}"
          git tag -a "${NEW}" -m "Release ${NEW}"
          git push origin "${NEW}"

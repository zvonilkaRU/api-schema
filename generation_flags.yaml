# Global generation flags — единственный конфиг генерации (infra#10-style
# консолидация, api-schema#10: проектного уровня zvonilkaRU/generation_flags.yaml
# больше нет, он не читался генератором и только создавал видимость переопределений).
# Слои: этот файл (дефолты) > {service}/generation_flags.yaml (per-service override,
# файл может отсутствовать — тогда действуют дефолты отсюда).

- name: GOLANG_SERVER_BODY_REQUEST_NO_AUTO_DEFAULTS
  default_value: false
  description: "Disable SetDefaults() on request body"
  affects: [golang]
  enabled: true
- name: GOLANG_SPLIT_REQUEST_RESPONSE
  default_value: false
  description: "Split schemas into Request/Response"
  affects: [golang]
  enabled: true
- name: USE_REQUIRED_V2
  default_value: false
  description: "Use x-request-required/x-response-required extensions"
  affects: [golang]
  enabled: true
- name: USE_UTC_FOR_DATE_TIME
  default_value: false
  description: "Force UTC for date-time serialization"
  affects: [golang]
  enabled: true
- name: GOLANG_USE_OPTIONAL
  default_value: false
  description: "Use optional.Optional[T] for x-optional fields"
  affects: [golang]
  enabled: true
- name: GOLANG_SCHEMA_ANY
  defaultEnum: warn
  description: "Control generation of Go `any` types (silent|warn|error)"
  affects: [golang]
  enabled: true

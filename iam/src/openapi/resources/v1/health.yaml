get:
  tags:
    - service
  summary: Health check
  operationId: healthCheck
  security: []
  responses:
    "200":
      description: Service is healthy.
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum: ["ok"]
            additionalProperties: false

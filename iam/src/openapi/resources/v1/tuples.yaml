post:
  tags:
    - tuples
  summary: Write relationship tuple
  description: Записывает кортеж отношения (user, relation, object).
  operationId: writeTuple
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - user
            - relation
            - object
          properties:
            user:
              type: string
              x-validations: ["Size >=1", "Size <=256"]
            relation:
              type: string
              x-validations: ["Size >=1", "Size <=64"]
            object:
              type: string
              x-validations: ["Size >=1", "Size <=256"]
          additionalProperties: false
  responses:
    "201":
      description: Tuple written.
      content:
        application/json:
          schema:
            type: object
            required:
              - user
              - relation
              - object
            properties:
              user:
                type: string
              relation:
                type: string
              object:
                type: string
            additionalProperties: false
    "400":
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "../../../../../common/src/openapi/schemas/errors/Error.yaml"
    "500":
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: "../../../../../common/src/openapi/schemas/errors/Error.yaml"

delete:
  tags:
    - tuples
  summary: Delete relationship tuple
  operationId: deleteTuple
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - user
            - relation
            - object
          properties:
            user:
              type: string
              x-validations: ["Size >=1", "Size <=256"]
            relation:
              type: string
              x-validations: ["Size >=1", "Size <=64"]
            object:
              type: string
              x-validations: ["Size >=1", "Size <=256"]
          additionalProperties: false
  responses:
    "204":
      description: Tuple deleted.
    "404":
      description: Tuple not found.
      content:
        application/json:
          schema:
            $ref: "../../../../../common/src/openapi/schemas/errors/Error.yaml"

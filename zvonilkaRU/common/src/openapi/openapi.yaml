      $ref: "./schemas/auth/TokenPair.yaml"
  parameters:
    pageSizeParam:
      $ref: "./parameters/list.yaml#/pageSizeParam"
    pageTokenParam:
      $ref: "./parameters/list.yaml#/pageTokenParam"
    filterParam:
      $ref: "./parameters/list.yaml#/filterParam"
    orderByParam:
      $ref: "./parameters/list.yaml#/orderByParam"

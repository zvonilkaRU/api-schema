# Project-level overrides for zvonilkaRU.
# Priority: per-service flags ({service}/generation_flags.yaml) > this file > root /generation_flags.yaml.
# Only flags that intentionally differ from root defaults are listed below.
# Duplicates of root defaults are intentionally absent.

# zvonilkaRU does NOT need auto-defaults on request body decode.
- name: GOLANG_SERVER_BODY_REQUEST_NO_AUTO_DEFAULTS
  description: "Disable SetDefaults() on server request body decode"
  enabled: false
  defaultValue: false
  targetValue: true
  affects: [golang]

# zvonilkaRU does NOT use x-request-required / x-response-required extensions.
- name: USE_REQUIRED_V2
  description: "Use x-request-required / x-response-required attributes"
  enabled: false
  defaultValue: false
  targetValue: true
  affects: [golang]

# zvonilkaRU does NOT use optional.Optional[T] for update request fields.
- name: GOLANG_USE_OPTIONAL
  description: "Use optional.Optional[T] for update request fields"
  enabled: false
  defaultValue: false
  targetValue: true
  affects: [golang]

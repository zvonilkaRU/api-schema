openapi: 3.1.0
info:
  title: Zvonilka IAM API
  description: |
    Identity & Access Management на базе OpenFGA.
    Поддерживает ReBAC (Relationship-Based Access Control).
    Authorization model: `authz/model.fga`.
  version: 1.0.0
servers:
  - url: https://iam.zvonilka.space
    description: Production
  - url: http://localhost:8080
    description: Local dev
paths:
  /iam/v1/tuples:
    $ref: "./resources/v1/tuples.yaml"
  /iam/v1/check:
    $ref: "./resources/v1/check.yaml"
  /iam/v1/health:
    $ref: "./resources/v1/health.yaml"
components:
  schemas:
    Error:
      $ref: "./../../../common/src/openapi/schemas/errors/Error.yaml"
    TupleRequest:
      $ref: "./schemas/models/TupleRequest.yaml"
    Tuple:
      $ref: "./schemas/models/Tuple.yaml"
    CheckRequest:
      $ref: "./schemas/models/CheckRequest.yaml"
    CheckResponse:
      $ref: "./schemas/models/CheckResponse.yaml"
    HealthStatus:
      $ref: "./../../../common/src/openapi/schemas/health/HealthStatus.yaml"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (ES256) от Users/Auth сервиса. IAM верифицирует через JWKS.

post:
  tags:
    - check
  summary: Check permission
  description: |
    Проверяет, имеет ли пользователь право на отношение к объекту.
    Поддерживает ReBAC — разрешения вычисляются через цепочки отношений.
  operationId: checkPermission
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/models/CheckRequest.yaml"
  responses:
    "200":
      description: Permission check result.
      content:
        application/json:
          schema:
            $ref: "../../schemas/models/CheckResponse.yaml"
    "400":
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "../../../../../common/src/openapi/schemas/errors/Error.yaml"
    "500":
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: "../../../../../common/src/openapi/schemas/errors/Error.yaml"

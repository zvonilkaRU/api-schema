openapi: 3.1.0
info:
  title: Zvonilka Rooms API
  description: CRUD для комнат аудио/видео звонков.
  version: 1.0.0
servers:
  - url: https://rooms.zvonilka.space
    description: Production
  - url: http://localhost:8080
    description: Local dev
paths:
  /rooms/v1/rooms:
    $ref: "./resources/v1/rooms.yaml"
  /rooms/v1/rooms/{id}:
    $ref: "./resources/v1/room.yaml"
  /rooms/v1/rooms/{id}/join:
    $ref: "./resources/v1/join.yaml"
  /rooms/v1/health:
    $ref: "./resources/v1/health.yaml"
  # WebSocket endpoint (not expressible in OpenAPI 3.1 — see main.go):
  #   GET /rooms/v1/rooms/{id}/events?token=<jwt>
  #   Events: participant.joined, participant.left, call.ended
components:
  schemas:
    Room:
      $ref: "./schemas/models/Room.yaml"
    CreateRoomRequest:
      $ref: "./schemas/models/CreateRoomRequest.yaml"
    RoomList:
      $ref: "./schemas/models/RoomList.yaml"
    Error:
      $ref: "./../../../common/src/openapi/schemas/errors/Error.yaml"
    Timestamp:
      $ref: "./../../../common/src/openapi/schemas/time/Timestamp.yaml"
    JoinToken:
      $ref: "./../../../common/src/openapi/schemas/media/JoinToken.yaml"
    HealthStatus:
      $ref: "./../../../common/src/openapi/schemas/health/HealthStatus.yaml"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (ES256) от Users/Auth сервиса.

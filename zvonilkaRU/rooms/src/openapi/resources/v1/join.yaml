post:
  tags:
    - rooms
  summary: Join room
  description: Возвращает LiveKit join-токен для подключения к аудио/видео комнате.
  operationId: joinRoom
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Join token.
      content:
        application/json:
          schema:
            $ref: "../../../../../common/src/openapi/schemas/media/JoinToken.yaml"
    "404":
      description: Room not found.
      content:
        application/json:
          schema:
            $ref: "../../../../../common/src/openapi/schemas/errors/Error.yaml"

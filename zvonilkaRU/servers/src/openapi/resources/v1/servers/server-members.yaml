get:
  tags:
    - servers
  summary: List server members
  operationId: listMembers
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Server ID.
    - $ref: "../../../../../../common/src/openapi/parameters/list.yaml#/pageSizeParam"
    - $ref: "../../../../../../common/src/openapi/parameters/list.yaml#/pageTokenParam"
  responses:
    "200":
      description: List of members.
      content:
        application/json:
          schema:
            $ref: "../../../schemas/models/MemberList.yaml"
    "403":
      description: Forbidden (not a server member).
      content:
        application/json:
          schema:
            $ref: "../../../../../../common/src/openapi/schemas/errors/Error.yaml"
    "404":
      description: Server not found.
      content:
        application/json:
          schema:
            $ref: "../../../../../../common/src/openapi/schemas/errors/Error.yaml"

get:
  tags:
    - servers
  summary: List server members
  operationId: listMembers
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Server ID.
  responses:
    "200":
      description: List of members.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../../schemas/models/ServerMember.yaml"
    "404":
      description: Server not found.
      content:
        application/json:
          schema:
            $ref: "../../../../../../common/src/openapi/schemas/errors/Error.yaml"

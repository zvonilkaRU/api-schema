name: ChannelList
description: Список каналов сервера с пагинацией.
type: object
required:
  - items
properties:
  items:
    type: array
    description: Каналы текущей страницы (порядок — по position).
    items:
      $ref: "./Channel.yaml"
  next_page_token:
    type: string
    description: Токен следующей страницы. Пустой или отсутствует — это последняя страница.
    x-validations: ["Size <=256"]
additionalProperties: false

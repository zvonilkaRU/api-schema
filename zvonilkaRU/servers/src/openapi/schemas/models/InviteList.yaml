name: InviteList
description: Список активных инвайтов сервера с пагинацией.
type: object
required:
  - items
properties:
  items:
    type: array
    description: Активные инвайты текущей страницы (порядок — по created_at, id).
    items:
      $ref: "./Invite.yaml"
  next_page_token:
    type: string
    description: Токен следующей страницы. Пустой или отсутствует — это последняя страница.
    x-validations: ["Size <=256"]
additionalProperties: false

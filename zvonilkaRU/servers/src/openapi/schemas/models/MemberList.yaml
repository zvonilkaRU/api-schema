name: MemberList
description: Список участников сервера с пагинацией.
type: object
required:
  - items
properties:
  items:
    type: array
    description: Участники текущей страницы (порядок — по joined_at, id).
    items:
      $ref: "./ServerMember.yaml"
  next_page_token:
    type: string
    description: Токен следующей страницы. Пустой или отсутствует — это последняя страница.
    x-validations: ["Size <=256"]
additionalProperties: false

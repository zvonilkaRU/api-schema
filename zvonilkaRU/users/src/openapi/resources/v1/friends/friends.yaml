get:
  tags:
    - friends
  summary: List friends
  description: >-
    Возвращает список друзей (accepted) постранично: обёртка FriendList
    {items, next_page_token}. Элементы — UserRef.
  operationId: listFriends
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../../../../common/src/openapi/parameters/list.yaml#/pageSizeParam"
    - $ref: "../../../../../../common/src/openapi/parameters/list.yaml#/pageTokenParam"
  responses:
    "200":
      description: List of friends.
      content:
        application/json:
          schema:
            $ref: "../../../schemas/friends/FriendList.yaml"
    "401":
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: "../../../../../../common/src/openapi/schemas/errors/Error.yaml"

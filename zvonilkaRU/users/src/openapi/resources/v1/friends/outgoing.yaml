get:
  tags:
    - friends
  summary: List outgoing friend requests
  description: Возвращает список исходящих (pending) заявок в друзья.
  operationId: listOutgoingRequests
  security:
    - bearerAuth: []
  responses:
    "200":
      description: List of outgoing pending requests.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../../schemas/models/UserRef.yaml"
    "401":
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: "../../../schemas/errors/Error.yaml"

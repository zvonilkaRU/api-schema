get:
  tags:
    - friends
  summary: List outgoing friend requests
  description: >-
    Возвращает список исходящих (pending) заявок в друзья. Поле id каждого
    элемента — идентификатор заявки (friendship row): его передают в
    DELETE /friends/outgoing/{id} для отмены.
  operationId: listOutgoingRequests
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../../../../common/src/openapi/parameters/list.yaml#/pageSizeParam"
    - $ref: "../../../../../../common/src/openapi/parameters/list.yaml#/pageTokenParam"
  responses:
    "200":
      description: List of outgoing pending requests.
      content:
        application/json:
          schema:
            $ref: "../../../schemas/friends/OutgoingRequestList.yaml"
    "401":
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: "../../../../../../common/src/openapi/schemas/errors/Error.yaml"

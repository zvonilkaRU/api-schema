post:
  tags:
    - friends
  summary: Send friend request
  description: Отправляет заявку в друзья пользователю по tag. Нельзя отправить себе, существующему другу, при ожидающей заявке или заблокированному пользователю. Лимит 100 заявок в день.
  operationId: sendFriendRequest
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../schemas/friends/SendFriendRequest.yaml"
  responses:
    "201":
      description: Friend request sent.
      content:
        application/json:
          schema: {}
    "401":
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: "../../../schemas/errors/Error.yaml"
    "403":
      description: User is not accepting friend requests.
      content:
        application/json:
          schema:
            $ref: "../../../schemas/errors/Error.yaml"
    "404":
      description: User not found by tag.
      content:
        application/json:
          schema:
            $ref: "../../../schemas/errors/Error.yaml"
    "409":
      description: Already friends or request already pending.
      content:
        application/json:
          schema:
            $ref: "../../../schemas/errors/Error.yaml"
    "422":
      description: Cannot send to self or validation error.
      content:
        application/json:
          schema:
            $ref: "../../../schemas/errors/Error.yaml"
    "429":
      description: Daily request limit reached.
      content:
        application/json:
          schema:
            $ref: "../../../schemas/errors/Error.yaml"

get:
  tags:
    - friends
  summary: List incoming friend requests
  description: Возвращает список входящих (pending) заявок в друзья.
  operationId: listIncomingRequests
  security:
    - bearerAuth: []
  responses:
    "200":
      description: List of incoming pending requests.
      content:
        application/json:
          schema: {}
    "401":
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: "../../../schemas/errors/Error.yaml"

get:
  tags:
    - service
  summary: Health check
  description: Liveness/readiness probe. Без аутентификации.
  operationId: healthCheck
  security: []
  responses:
    "200":
      description: Service is healthy.
      content:
        application/json:
          schema:
            $ref: "../../../../../../common/src/openapi/schemas/health/HealthStatus.yaml"
    "503":
      description: Service is unhealthy.
      content:
        application/json:
          schema:
            $ref: "../../../../../../common/src/openapi/schemas/health/DegradedStatus.yaml"
